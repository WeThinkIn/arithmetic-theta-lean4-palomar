version: v0.4
project:
  name: Canonical scheme discriminant square and arbitrary base-change naturality
  description: 'Complete original accepted080 and081: canonical discriminant-square
    section exists for every actual elliptic group family over every scheme over a
    characteristic-zero field, with every affine Weierstrass test, and commutes with
    every actual pointed Cartesian base change. Retains nonreduced rings, nonflat
    maps, actual conormal and24th tensor powers, canonical derivative comparisons,
    complete five-Kato normalization and existence of normal test models. Supporting
    canonical constructions are also Comparator targets. See challenges/full-scheme-discriminant/Scope.json.
    No full-paper completion claimed.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Recorded pre-submission machine checks cover all 18 configured targets,
    their complete current-source exported dependency closure and standard axioms.
    All 452 original Challenge declarations are preserved; two syntax
    declarations are added. All 18 target anchors render without errors.
    Original endpoints 080, 081 are recovered with matching ordered universes
    and Lean-checked original types. See docs/audit/full-scheme-discriminant-render-repair-2262/Review.md for the precise
    distinction between raw expression identity and definitional equality.
    This is not a distinct agent's semantic review. Historical official results
    remain bound to their source revisions; official acceptance of this repair
    and whole-paper semantic acceptance have not been established.
status:
  scope: 'Complete original accepted080 and081: canonical discriminant-square section
    exists for every actual elliptic group family over every scheme over a characteristic-zero
    field, with every affine Weierstrass test, and commutes with every actual pointed
    Cartesian base change. Retains nonreduced rings, nonflat maps, actual conormal
    and24th tensor powers, canonical derivative comparisons, complete five-Kato normalization
    and existence of normal test models. Supporting canonical constructions are also
    Comparator targets. See challenges/full-scheme-discriminant/Scope.json. No full-paper
