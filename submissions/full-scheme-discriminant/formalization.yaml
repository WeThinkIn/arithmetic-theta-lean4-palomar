fidelity:
  divergences: Complete original080/081 conclusions recovered through proved equivalences
    and equalities of canonical comparison maps. The other101 original endpoints are
    outside this configuration; supporting targets do not add endpoint credit. No
    normality, reducedness, flatness, chosen frame or level structure is added to
    final statements.
