fidelity:
  divergences: Complete original083/086 conclusions recovered through exact predicate
    equivalences and reverse original-type checks. The other101 original endpoints
    are outside this configuration. Norm families are constructed existentially, with
    the scalar structure induced by the actual scheme map; no arbitrary norm operator,
    geometric-point-only test, flatness, domain or reducedness premise is added.
