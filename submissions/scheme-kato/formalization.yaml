version: v0.4
project:
  name: Scheme Kato unit naturality and intrinsic norm characterization
  description: 'Complete original accepted083 and086: Kato unit naturality for every
    actual pointed Cartesian base change, and intrinsic characterization by the actual
    Cartier divisor and multiplication2and3 norm invariance. Preserves arbitrary schemes,
    nonreduced coefficient rings, nonflat maps, actual torsion complements, all normal-model/affine
    tests, full determinant-normalized multiplicative norm families on all opens,
    and restriction compatibility. Includes actual geometry, normal-model existence
    and scheme-unit existence support targets. See challenges/scheme-kato/Scope.json.
    No full-paper completion claimed.'
