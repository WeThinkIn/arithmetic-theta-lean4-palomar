version: v0.4
project:
  name: Complete compact unary naturality under coefficient embeddings
  description: 'Full original070: for EVERY embedding of characteristic-zero coefficient
    fields and EVERY pair of actual normalized unary OpenPower choices and compact
    sections with their original open restrictions, constructs an actual compact Hodge
    isomorphism extending the SAME prescribed normalized open comparison and proves
    exact equality of the transported global sections. The complete classifier, identity-ideal
    conormal normalization, all-extension geometric canonicity, actual pullback maps
    and original exponent are retained. Bidirectional record transports preserve identical
    mathematical objects and only rewrite proven-equivalent predicates; the full original
    theorem is recovered by compilation.'
