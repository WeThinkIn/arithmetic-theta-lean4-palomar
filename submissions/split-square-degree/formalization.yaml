version: v0.4
project:
  name: Complete split-field square-cover degree
  description: 'Full original074: over any characteristic-zero field containing the
    specified primitive Lth root, the actual square root of the component Hodge line
    satisfies the complete degree formula on every original finite flat cover. It
    establishes the geometric chart and invertibility conditions and normal frame
    existence, then quantifies over ALL actual normal frames, nonzero sections and
    their actual Scheme.ord divisors. The exact residue-field weighted degree equation
    and bound are retained, including exponent0 and the actual generic finrank. No
    algebraic-closure assumption, divisor provider or surrogate degree is introduced.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: 'Local agent self-assessment of the recorded interface and proof checks; this status
    does not represent independent external review or official Palomar semantic approval. Recorded
    local validation basis: Challenge imports Mathlib and the pinned Lean compiler module for
    local cache isolation; no project proof imports. Actual exported dependency structure and
    standard axiom closure pass local unmodified Lake comparison. Exact original endpoint recovery
    passes. Official mechanical and semantic review remain pending.'
status:
  scope: 'Full original074: over any characteristic-zero field containing the specified
    primitive Lth root, the actual square root of the component Hodge line satisfies
    the complete degree formula on every original finite flat cover. It establishes
    the geometric chart and invertibility conditions and normal frame existence, then
    quantifies over ALL actual normal frames, nonzero sections and their actual Scheme.ord
    divisors. The exact residue-field weighted degree equation and bound are retained,
    including exponent0 and the actual generic finrank. No algebraic-closure assumption,
