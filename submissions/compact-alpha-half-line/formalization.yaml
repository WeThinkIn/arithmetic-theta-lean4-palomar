version: v0.4
project:
  name: Complete compact alpha canonical half-divisor line
  description: 'Full original042: for each actual compact component, constructs the
    effective half-divisor of the same compact alpha, normality witness, actual bounded-pole
    sheaf O(E), canonical rational-one section, invertibility and square isomorphism
    to the same Hodge line. HalfAlphaDivisor retains exact all-frame Scheme.ord equality,
    zero off cusps and orders0 or L/8. On every original canonical disk the complete
    theta(t^(L/2)) coefficient and its square equal the specified normalized Hodge
    generator. The unique comparison on every open/local tensor is proved equal to
    the original canonical pullback map; every original theorem type is recovered.'
