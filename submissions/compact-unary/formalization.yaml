fidelity:
  divergences: Original mathematical definitions and main target retained. Local compiler
    proof/matcher caches are isolated between extracted source fragments; thirteen
    original auxiliary propositions are explicit theorem targets, with their actual
    original Solution proofs. Local lexical notation spells repeated explicit typeclass
    expressions; it adds no mathematical provider. No definition holes. Exact exported
    comparison and axiom closure pass locally; independent kernel and official checks
    remain separate.
