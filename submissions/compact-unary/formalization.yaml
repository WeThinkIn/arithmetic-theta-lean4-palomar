version: v0.4
project:
  name: Complete actual compact unary Hodge realization
  description: 'Full original028: for positive even m,N with m dividing N and every
    normalized residue, constructs the prescribed indices a,b, actual normalized open
    unary data and the UNIQUE regular global section of the original compact Hodge
    line power. It retains the actual open restriction, open frame, nonzero integral
    coefficient on EVERY marked disk, and COMPLETE unary^(exponent N) expansion on
    every canonical marking with the same extending normalized Hodge generator. Actual
    quotient/kernel maps, point evaluation, intrinsic discriminant, normalization
    and full series are exposed. Bidirectional transports preserve all actual objects
    and recover the full original theorem.'
