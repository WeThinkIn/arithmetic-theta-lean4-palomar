version: v0.4
project:
  name: Transport of the Tate disk under field extension
  description: This entry verifies transport of the tate disk under field extension,
    including the explicitly selected supporting declarations. The complete cyclotomic
    modularity, extended modularity and conservative image-consumer endpoints are
    recovered separately by FactorBridge, SquareFactorBridge and ConsumerFactorBridge.
    This configuration alone does not select all three original endpoints or all103
    endpoints.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
