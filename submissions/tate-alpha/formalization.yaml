version: v0.4
project:
  name: Complete relative alpha Tate behavior
  description: 'Complete original accepted040: for every positive L divisible by4,
    actual full marking on the actual Tate cubic Q=t^L and original normalized boundary
    differential, every realizing alpha has a full power-series-unit expansion with
    exact order0 or L/4. Every primitive root and canonical marking give the exact
    signed thetaAt squared identity. Literal full series, all nonidentity coordinate
    combinations and original boundary generator retained. Eight support/main targets
    selected. Inherited052 not counted twice. See challenges/tate-alpha/Scope.json;
    no whole-paper completion claimed.'
