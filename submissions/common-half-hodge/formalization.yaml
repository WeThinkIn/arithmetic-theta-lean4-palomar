version: v0.4
project:
  name: Complete common half-Hodge cover and prescribed disk branch
  description: 'Full original034: constructs the specified disk factorization through
    its actual geometric component, actual cusp half-divisor line, and an integral
    smooth proper finite-etale surjective cover of positive degree at most24. The
    same cover carries a square isomorphism to the original Hodge line whose canonical
    squared section has24th power equal to the same D2. It constructs a disk lift
    and, for every extending normalized Hodge generator, an actual frame with canonical
    cusp section=complete Euler(t^L)*t^(L/24)*frame and square mapping to that same
    generator. All geometric properties, degree bounds, actual maps and branch equations
    remain explicit constructor fields. Bidirectional compiled transports recover
    the full original cover/branch predicate with the SAME scheme, map and square
    isomorphism.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
