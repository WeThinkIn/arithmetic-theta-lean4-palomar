version: v0.4
project:
  name: Complete phase-free alpha descent
  description: 'Complete original accepted096 at arbitrary universe u: unique descended
    section in the actual cotangent tensor multiplier line, with frame generation
    on every subopen. Descends retains every marked test, both existence witnesses
    for actual cotangent comparison and realizing alpha, and full tensor equality
    for every such comparison and section. Canonical binary tensor map uniquely specified
    on every local pure tensor and proved equal to original. Eleven support/main targets
    selected. Inherited052095097 not recounted. See challenges/phase-free-alpha-descent/Scope.json;
    no whole-paper completion claimed.'
