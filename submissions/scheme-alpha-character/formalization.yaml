version: v0.4
project:
  name: Complete scheme alpha character
  description: 'Complete original accepted052 at arbitrary universe u: the exact even-stabilizer
    character on the actual cotangent alpha for the same global Miller phase, constructing
    every changed actual full level4 marking and retaining its phase. Independent
    canonical differential and conormal maps are uniquely fixed by their local derivative
    formulas, with compiled original-map identities and original RealizesAlpha equivalences.
    Actual global alpha existence and normalized-frame support included. Empty and
    nonreduced bases retained. See challenges/scheme-alpha-character/Scope.json; no
    whole-paper completion claimed.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
