version: v0.4
project:
  name: Sharp arithmetic theta bound, certified adaptive solver and exact image
  description: 'Seven complete original endpoints: exact distinct-norm sharp cutoff
    and all larger theta relation kernels; executable adaptive first-stop solver with
    internal checked basis changes, complete kernel/image/unique-coordinate output
    and singleton-zero behavior; certificate-derived exact theta image data. Includes
    supporting finite-shell assertions. The other 96 original endpoints are outside
    this configuration. See challenges/sharp-adaptive-image/Scope.json.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    The pre-submission assessment for this configuration comprises local compilation,
    exact target and original-endpoint checks, and proof-axiom checks performed in
    the development and verification workflow. These checks do not establish a
    distinct independent agent review. See docs/audit/sharp-adaptive-image-351/README.md
    and docs/audit/official-sharp-adaptive-image-2079/Review.md for the recorded checks.
    The later ordinary mechanical result is recorded separately in
    docs/audit/official-ordinary-sharp-adaptive-2168/Review.md and is bound to its
    submitted commit; it does not certify this metadata revision.
status:
  scope: 'Seven complete original endpoints: exact distinct-norm sharp cutoff and
    all larger theta relation kernels; executable adaptive first-stop solver with
    internal checked basis changes, complete kernel/image/unique-coordinate output
    and singleton-zero behavior; certificate-derived exact theta image data. Includes
    supporting finite-shell assertions. The other 96 original endpoints are outside
    this configuration. See challenges/sharp-adaptive-image/Scope.json.'
fidelity:
  divergences: Independent definitions and explicit proven bridges preserve accepted-046,
    accepted-049, accepted-064 through accepted-067 and accepted-088. No full-paper
    verification is claimed. Geometric construction endpoints accepted-047/048 and
    scheme-discriminant endpoints accepted-080/081 are not public outputs of this
    configuration.
