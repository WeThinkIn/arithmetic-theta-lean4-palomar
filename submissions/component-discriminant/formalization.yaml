version: v0.4
project:
  name: Complete actual component discriminant divisor
  description: 'Full original030: the same actual compact intrinsic D2 section restricts
    nontrivially to every actual component and has finite-support section divisor
    exactly2L times the reduced cusp divisor, zero everywhere else. The conclusion
    holds in every original normal affine frame using actual Scheme.ord. IsCompactD2
    only asserts the correct open restriction to the intrinsic D2; its full all-test
    normal affine normalized5-Kato and initial-term conditions are visible. Generic
    normalization uses actual Cartier identity/torsion ideals, multiplication maps
    and determinant norms. Actual tensor pullbacks and restrictions are proved equal
    to original constructions. No divisor or expansion is added as a premise.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Local checks retain all 33 configured obligations and original endpoints
    accepted-030. Current Solution build, complete target-closure structural and standard
    axiom checks, original type/universe/recovery checks and clean rendering pass.
    Compiler-only differences and exact versus definitionally equal types are
    documented in docs/audit/historical-render-repairs-2370/component-discriminant/Review.md. This is not a distinct agent's semantic review.
    Fresh official verification and semantic review remain pending for this revision.
