version: v0.4
project:
  name: Complete actual component discriminant divisor
  description: 'Full original030: the same actual compact intrinsic D2 section restricts
    nontrivially to every actual component and has finite-support section divisor
    exactly2L times the reduced cusp divisor, zero everywhere else. The conclusion
    holds in every original normal affine frame using actual Scheme.ord. IsCompactD2
    only asserts the correct open restriction to the intrinsic D2; its full all-test
    normal affine normalized5-Kato and initial-term conditions are visible. Generic
    normalization uses actual Cartier identity/torsion ideals, multiplication maps
    and determinant norms. Actual tensor pullbacks and restrictions are proved equal
    to original constructions. No divisor or expansion is added as a premise.'
  license: Apache-2.0
