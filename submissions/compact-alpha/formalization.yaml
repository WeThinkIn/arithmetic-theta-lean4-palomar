version: v0.4
project:
  name: Complete compact full-level alpha section
  description: 'Full original041: over every original algebraically closed characteristic-zero
    field and positive L divisible by8, the supplied actual full-level compactification
    with canonical Hodge Extension has one unique genuine global alpha section. Its
    restriction is the intrinsic alpha on every original normal affine classifying
    test. At every actual marked cusp its full coefficient is t^j times a power-series
    unit, with j=0 or L/4 and j even. At the canonical marking it has exactly the
    complete theta(t^(L/2))^2 expansion in the same normalized Hodge generator. All
    actual geometric objects, explicit algebraic root formulas, canonical differential
    maps and full series remain visible; no unknown scalar or finite-prefix substitute
    is used.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
