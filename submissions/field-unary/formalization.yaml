version: v0.4
project:
  name: Complete arbitrary-field compact unary Hodge realization
  description: >-
    Given compatible level data, a compactification, and a Hodge extension satisfying
    Canonical and GeometricallyCanonical, proves the full original069 over arbitrary
    characteristic-zero fields. The compatible level data, compactification, Hodge
    extension, and these properties are supplied hypotheses; this result does not
    construct those inputs. Under these hypotheses, constructs the prescribed indices
    and actual open normalized unary data, then the UNIQUE genuine compact global
    section with correct open restriction, open frame, nonzero coefficient at EVERY
    disk and COMPLETE unary power for EVERY canonical marking and specified normalized
    generator. The supplied GeometricallyCanonical predicate retains EVERY
    algebraically closed coefficient extension, actual full classifiers on arbitrary
    schemes, normalized conormal derivatives and the UNIQUE comparison of actual
    compact Hodge lines extending the specified open map. Only proven-equal
    conormal/tensor maps are renamed; compiled equivalences recover all predicates and
    the complete original theorem.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Pre-submission assessment based on recorded machine checks: all 32 configured
    obligations, shared declarations, complete target closure, standard axioms,
    and exact original069 recovery were checked. The repaired Challenge renders
    all 32 target anchors without elaboration errors. These checks are not
    presented as a distinct agent's semantic review. The previous-revision
    official run remains separate; official acceptance of this repaired revision
    and whole-paper semantic acceptance have not been established.
