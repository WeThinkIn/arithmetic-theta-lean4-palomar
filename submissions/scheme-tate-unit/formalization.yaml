version: v0.4
project:
  name: Complete scheme Kato unit and full Tate expansion
  description: 'Complete original accepted084: unique same actual elliptic scheme
    unit with full Kato normalization, Cartier divisor, every positive coprime determinant
    norm and complete period-one Tate expansion after its actual pullback. Retains
    every coefficient-field extension and actual pointed Cartesian test, the concrete
    curve and both coordinates, faithful function-field evaluation and full Laurent
    gamma products. Explicit gamma-limit existence support prevents vacuous conditional
    expansion. Includes inherited083/086 targets, counted only once. See challenges/scheme-tate-unit/Scope.json.
    No full-paper completion claimed.'
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: 'Local agent self-assessment of the recorded interface and proof checks; this status
    does not represent independent external review or official Palomar semantic approval. Recorded
    local validation basis: Original support/main targets preserved with explicitly checked
    original support lemmas. Complete local strict structural and standard-axiom checks passed.
    Solution is unchanged. Fresh official mechanical and semantic review remain pending.'
status:
  scope: 'Complete original accepted084: unique same actual elliptic scheme unit with
    full Kato normalization, Cartier divisor, every positive coprime determinant norm
    and complete period-one Tate expansion after its actual pullback. Retains every
    coefficient-field extension and actual pointed Cartesian test, the concrete curve
