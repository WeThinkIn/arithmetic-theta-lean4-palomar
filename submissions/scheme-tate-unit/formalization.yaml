fidelity:
  divergences: Original084 full type recovered through exact predicate equivalences;
    no new assumption on the scheme base, no restriction of all coprime positive norms
    to2/3, no truncation and no product equation in test data. The scope includes
    inherited083/086 but does not claim other original endpoints.
