version: v0.4
project:
  name: Complete relative alpha naturality
  description: >-
    Complete original038 and039 at arbitrary universe u: root data and a unique alpha frame
    for every positive level divisible by four, with naturality for every original pointed
    Cartesian base change preserving both marking equations. The canonical Hodge comparison is
    uniquely specified on all local universal derivatives and proved equal to the original.
    For the selected scheme-alpha character theorem (original052), let S be a scheme over a
    characteristic-zero field, E its elliptic family, M a full level-four marking, z a global
    scalar satisfying MillerPhase E M z, and a a cotangent section satisfying RealizesAlpha E
    M a. For every matrix A over ZMod 4 satisfying PreservesEven (determinant one and
    preservation of the even quadratic form modulo two), there exists a full level-four
    marking Mprime with Changes E M Mprime A and the same phase MillerPhase E Mprime z. Every
    section aprime realizing alpha for Mprime satisfies aprime = z ^ (characterExponent A).val
    * a, where multiplication denotes the scalar action on cotangent sections. The phase and
    realizing-section conditions are explicit hypotheses, and the conclusion is equality of
    global sections. All 19 configured obligations are retained, including eleven support/main
    targets and eight explicit helper obligations. Original052 is included without duplicate
    endpoint credit. No whole-paper completion is claimed.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Pre-submission assessment based on recorded machine checks: all 19 configured
    obligations and their complete current-source target closure, standard axioms,
    and exact recovery of original038039052 were checked. All 428 original
    Challenge declarations are preserved; two syntax/elaboration definitions are
    added. The repaired Challenge renders all 19 target anchors without errors.
    These checks are not presented as a distinct agent's semantic review. The
    historical official result remains bound to its original source revision;
    official acceptance of this repaired revision and whole-paper semantic
    acceptance have not been established.
