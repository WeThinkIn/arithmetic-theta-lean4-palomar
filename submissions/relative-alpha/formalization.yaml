version: v0.4
project:
  name: Complete relative alpha naturality
  description: 'Complete original accepted038 and039 at arbitrary universe u: root
    data and unique alpha frame for every positive level divisible by4, with naturality
    for every original pointed Cartesian base change, preserving both full-level marking
    equations. Canonical Hodge comparison uniquely specified on all local universal
    derivatives and proved equal to the original. Inherited complete052 included without
    duplicate credit. All eleven support/main targets selected. See challenges/relative-alpha/Scope.json;
    no whole-paper completion claimed.'
