version: v0.4
project:
  name: Complete isogeny alpha expansion and every-cusp orders
  description: For supplied LevelData k L and OpenAlpha k L m D, the selected theorems
    prove the original043/044 expansion and every-cusp-order conclusions for
    that supplied data. They do not independently construct LevelData or OpenAlpha
    and do not assert existence of these inputs. The quotient and normalized alpha
    described below belong to this supplied geometric data. The results apply to all original
    algebraically closed characteristic-zero fields, positive L,m with m even and8*m
    dividing L. The actual quotient has its full finite-etale degree, scheme kernel
    and universal property, and its full-four marking is forced by the original source
    labels. The normalized pullback uses the actual differential map and literal factor1/m.
    DesignatedExpansion proves the complete signed theta(t^(L*m/2))^2 coefficient
    in the same source differential. AllCuspOrders constructs actual kernel coordinates
    and the full t^j-unit coefficient for every source test, retaining the mixed component/toric
    degrees and exact4*m*j=L*e^2 alternative with even j. No arbitrary target period,
    differential factor, extra cover, unknown unit in the designated formula or finite-prefix
    equality is substituted.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Recorded pre-submission machine checks cover all 29 configured targets,
    their complete current-source exported dependency closure and standard axioms.
    Original mathematical declarations are preserved; compiler/syntax differences
    are explicitly documented in docs/audit/isogeny-alpha-cusps-render-repair-2282/Review.md.
    All 29 target anchors render without errors. Original endpoints 043, 044
    are recovered with exact types and ordered universes and compiled recovery
    equalities. This is not a distinct agent's semantic review. Historical official
    results remain bound to their source revisions; official acceptance of this
    repair and whole-paper semantic acceptance have not been established.
