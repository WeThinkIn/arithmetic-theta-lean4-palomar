version: v0.4
project:
  name: Complete arbitrary finite Gram-family conservative geometry and cutoff
  description: Complete original035/036. For EVERY nonempty finite family of positive-rank
    valid integral Gram matrices, constructs actual arithmetic indexing/formal identity
    and ALL level model, compactification, canonical Hodge extension and Tate disk
    data, then an actual cusp half-divisor line, finite flat cover with degree at most 24*(exponent
    N)^indexCount, square-compatible common frame, nonzero unary sections and coset
    tensor-polynomial matrix sections with COMPLETE theta expansion for every scalar
    combination. The actual cusp divisor and residue-field weighted degrees are specified
    in every normal frame. The EXACT original conservative cutoff consumer is retained.
    Only canonical tensor comparisons proved equal to the originals are renamed; compiled
    equivalence recovers the whole existential geometric predicate.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Pre-submission assessment based on recorded machine checks: all 34 configured
    obligations, shared declarations, complete target closure, standard axioms
    and exact original035036 recovery were checked. Local rendering of the
    current Challenge resolves all 34 target anchors without elaboration errors.
    These checks are not presented as a distinct agent's semantic review.
    Official full mechanical preflight 39974154203 passed at source commit
    8f25de079ade1664370872d258174ff00aa90fd6 with stock Lean, NanoDa and Conron
    acceptance. The historical result remains bound to its original metadata and
    build configuration; it does not certify this metadata revision or establish
    whole-paper semantic acceptance.
