version: v0.4
project:
  name: Complete component Hodge power degree
  description: Full original031 over every original algebraically closed characteristic-zero
    field and even L >= 3. For every actual component, canonical compact Hodge extension,
    natural n (including zero), actual normal frame cover and nonzero global section
    with its actual section divisor, the residue-weighted degree satisfies exactly
    24*degree=n*2*L*#cusps and the upper bound n*#SL2. Canonical retains every actual
    disk test, the specific Tate cubic, normalized differential and actual canonical
    pointed differential pullback, with a unique extending generator. No arbitrary
    line, scalar comparison, degree or expansion function replaces these objects.
    The complete types and available bodies of these constructions are retained.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
