version: v0.4
project:
  name: Complete conservative theta relation bound and arithmetic components
  description: This entry formalizes an explicit conservative coefficient bound determining
    all complex linear relations among complete lattice theta series for arbitrary finite valid
    even integral Gram families, including rank zero and all larger cutoffs. The selected statements
    also prove rational orthogonal-sublattice factorization through actual preimage cosets;
    exact coefficient enumeration using rational LDL decomposition and recursive ellipsoid enumeration,
    with equality to the true theta coefficients and coefficient matrices; and concrete lattice
    results including binary factorization, the determinant-80 forms, and nonsimilar rank-16
    lattices with equal theta series. The formal-identity results include the Jacobi triple
    product, the quartic theta identity, Tate-series addition identities, and the powered gamma
    norm identity. The selection further proves existence and uniqueness of finite étale norm
    families on arbitrary schemes. The 43 selected targets cover 40 original endpoints together
    with their supporting declarations; the other 63 original endpoints are outside this entry.
    See challenges/main-and-components-complete/Scope.json for the precise scope.
