version: v0.4
project:
  name: Complete discriminant twist unit and designated Tate root
  description: 'Full original032/033: from the original canonical compact geometry,
    intrinsic D2 and actual cusp half-divisor line, constructs the actual twist, multiplication
    isomorphism and generating24th-power section with the D2 factorization in every
    actual local frame. For every such valid twist and every original disk factorization,
    constructs the UNIQUE actual twist frame whose24th power equals the same pulled-back
    unit and whose product with the square of the canonical cusp section is exactly
    Euler(t^L)^2*t^(L/12) times the specified normalized Hodge generator. The Euler
    series is the full product. Actual tensor frames, all-frame divisor tests and
    every canonical pullback map are retained or proved equal to the original; no
    root/expansion provider is supplied.'
