fidelity:
  divergences: Original mathematical data, quantifiers and main conclusion retained;
    original endpoint recovered by compiled equality. Explicit auxiliary proposition
    targets and cache isolation stabilize exact exported declarations. Lexical notation
    shortens repeated syntax without new mathematical definitions. No definition holes
