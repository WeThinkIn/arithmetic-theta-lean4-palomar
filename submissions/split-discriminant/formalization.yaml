version: v0.4
project:
  name: Complete split-field component discriminant divisor
  description: Full original073 over every characteristic-zero field with its supplied
    primitive Lth root. From the actual canonical compact Hodge geometry and intrinsic
    compact D2, proves nonzero restriction on every actual component and the exact
    finite-support divisor:2L at every cusp and0 everywhere else, in EVERY original
    normal affine frame. All intrinsic Kato/initial-term and canonical tensor comparison
    definitions from509 remain intact. No algebraic closure, divisor, local expansion
    or new provider premise is added.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: agent-reviewed
  notes: Challenge imports Mathlib and the pinned Lean compiler module for local cache
    isolation; no project proof imports. Actual exported dependency structure and
    standard axiom closure pass local unmodified Lake comparison. Exact original endpoint
    recovery passes. Official mechanical and semantic review remain pending.
status:
  scope: Full original073 over every characteristic-zero field with its supplied primitive
    Lth root. From the actual canonical compact Hodge geometry and intrinsic compact
    D2, proves nonzero restriction on every actual component and the exact finite-support
    divisor:2L at every cusp and0 everywhere else, in EVERY original normal affine
    frame. All intrinsic Kato/initial-term and canonical tensor comparison definitions
