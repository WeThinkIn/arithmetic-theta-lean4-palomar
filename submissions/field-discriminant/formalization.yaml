version: v0.4
project:
  name: Complete arbitrary-field compact discriminant realization
  description: Full original068 over arbitrary characteristic-zero fields. From the
    original actual canonical geometry and intrinsic open D2, constructs the UNIQUE
    compact global section of the same Hodge line to the24th power with correct open
    restriction and COMPLETE normalized discriminant expansion at EVERY actual disk
    and specified extending Hodge generator. The literal complete series, all coefficients
    below2L vanishing and coefficient2L exactly one are retained. Every algebraically
    closed coefficient comparison uses the original full all-scheme classifiers and
    inclusion-compatible identity-ideal conormal derivative. Only proved-equal tensor/conormal
    maps are renamed; compiled equivalences recover all original predicates and the
    complete theorem.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
