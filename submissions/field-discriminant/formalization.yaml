version: v0.4
project:
  name: Complete arbitrary-field compact discriminant realization
  description: Full original068 over arbitrary characteristic-zero fields. From the
    original actual canonical geometry and intrinsic open D2, constructs the UNIQUE
    compact global section of the same Hodge line to the24th power with correct open
    restriction and COMPLETE normalized discriminant expansion at EVERY actual disk
    and specified extending Hodge generator. The literal complete series, all coefficients
    below2L vanishing and coefficient2L exactly one are retained. Every algebraically
    closed coefficient comparison uses the original full all-scheme classifiers and
    inclusion-compatible identity-ideal conormal derivative. Only proved-equal tensor/conormal
    maps are renamed; compiled equivalences recover all original predicates and the
    complete theorem.
  license: Apache-2.0
  authors:
  - Jue Ding
  responsible_maintainers:
  - Jue Ding
classification:
  arxiv:
  - math.NT
  - math.AG
sources:
- title: Arithmetic determination of relations among lattice theta series
  type: paper
  location: paper/Arithmetic determination of relations among lattice theta series
    - Exact Tate normalization and common finite covers.pdf
  relationship: formalizes
- title: Original arithmetic theta kernel task
  type: paper
  location: paper/OriginalTask.tex
  relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: self-assessed
  notes: >-
    Local checks retain all 32 configured obligations and original endpoints
    accepted-068. Current Solution build, complete target-closure structural and standard
    axiom checks, original type/universe/recovery checks and clean rendering pass.
    Compiler-only differences and exact versus definitionally equal types are
    documented in docs/audit/historical-render-repairs-2370/field-discriminant/Review.md. This is not a distinct agent's semantic review.
    Fresh official verification and semantic review remain pending for this revision.
