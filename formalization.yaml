version: v0.4
project:
  name: Arithmetic determination of relations among lattice theta series
  description: >-
    Arithmetic constructions for finite families of positive-definite even integral
    lattice theta series, with complete relation kernels, image bases, rational
    coordinates, explicit coefficient bounds, and certified stopping criteria.
    The original Lean 4.33.1 delivery and the Lean 4.35.0-rc2 edition have passed
    complete local verification of the specified development. Whole-paper
    independent Palomar verification and registration remain in progress.
  license: "Apache-2.0"
  authors: ["Jue Ding"]
  responsible_maintainers: ["Jue Ding"]
classification:
  arxiv: [math.NT, math.AG]
sources:
  - title: Arithmetic determination of relations among lattice theta series
    type: paper
    location: paper/Arithmetic determination of relations among lattice theta series - Exact Tate normalization and common finite covers.pdf
    relationship: formalizes
  - title: Original arithmetic theta kernel task
    type: paper
    location: paper/OriginalTask.tex
    relationship: formalizes
automation:
  methods:
    - method: agent
      framework: WujieAI Lean4 Agent and Codex
      tool_setup: >-
        AI-assisted mathematical construction and proof development for the original
        arithmetic theta task; Lean proof implementation, debugging and integration;
        and independent Palomar adaptation, interface preparation and verification tooling.
  notes: >-
    Codex contributed to the mathematical construction, as explicitly credited in
    paper/OriginalTask.tex, as well as to the Lean formalization. The WujieAI Lean4
    Agent and Codex were used in the proof-development workflow; Codex also assisted
    the Lean 4.35.0-rc2 port and Palomar verification preparation. Human project
    author and responsible maintainer is Jue Ding. See docs/AIContributions.md for
    the contribution account and its source provenance.
review:
  status: agent-reviewed
  notes: >-
    The original Lean 4.33.1 delivery has passed its exact-type and axiom audit.
    The Lean 4.35.0-rc2 edition has passed the complete GoalRoot build and all
    103 original endpoint type and standard-axiom checks. These local results
    are distinct from official preflight, whole-paper semantic review and
    registry acceptance, which remain incomplete. Scope-specific official
    outcomes are recorded in docs/PalomarPreflight.md.
status:
  scope: >-
    All thirteen original source requirements and all 103 frozen integration
    obligations are retained. Local independent interface coverage and the
    remaining scope are recorded in docs/Coverage.md; interface coverage is
    not a count of official passes.
fidelity:
  divergences: >-
    The published port preserves all 103 original endpoint statements, including
    their hypotheses, universe parameters and full conclusions. Independent
    Challenge/Solution coverage and whole-paper Palomar acceptance remain
    separate, incomplete verification tasks.
