name: Palomar official mechanical preflight
run-name: Palomar full preflight at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      comparator_config_path:
        description: 'Scoped configuration for official mechanical verification'
        required: false
        default: comparator.json
        type: choice
        options:
          - comparator.json
          - comparator-early.json
          - comparator-main-and-components.json
          - comparator-formal-cover.json
          - comparator-main-complete.json
          - comparator-sharp-adaptive-image.json
          - comparator-sharp-and-roots.json
          - comparator-sharp-and-coordinates.json
          - comparator-full-scheme-discriminant.json
          - comparator-scheme-kato.json
          - comparator-scheme-initial.json
          - comparator-scheme-tate-unit.json
          - comparator-field-unary.json
          - comparator-split-square-degree.json
          - comparator-split-discriminant.json
          - comparator-compact-unary.json
          - comparator-common-half-hodge.json
          - comparator-discriminant-twist-root.json
          - comparator-component-discriminant.json
          - comparator-isogeny-half-line.json
          - comparator-compact-alpha-half-line.json
          - comparator-isogeny-alpha-cusps.json
          - comparator-compact-alpha.json
          - comparator-split-cusp.json
          - comparator-component-hodge-degree.json
          - comparator-unary-geometric.json
          - comparator-component-cusp.json
          - comparator-arbitrary-rigidification.json
          - comparator-key-tate.json
          - comparator-even-point-evaluation.json
          - comparator-phase-free-key.json
          - comparator-phase-free-alpha-descent.json
          - comparator-multiplier-fourth.json
          - comparator-phase-free-multiplier.json
          - comparator-tate-alpha.json
          - comparator-relative-alpha.json
          - comparator-scheme-alpha-character.json
          - comparator-scheme-miller-phase.json
          - comparator-period-one.json
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.identifier.outputs.id }}
      options: ${{ steps.identifier.outputs.options }}
    steps:
      - id: identifier
        name: Generate twelve-character preflight request identifier
        env:
          COMPARATOR_CONFIG: ${{ inputs.comparator_config_path || 'comparator.json' }}
        run: |
          python3 - <<'PY'
          import json, os, secrets
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('id=' + secrets.token_hex(6), file=output)
              config = os.environ['COMPARATOR_CONFIG']
              if config not in ('comparator-period-one.json', 'comparator-scheme-initial.json', 'comparator-scheme-tate-unit.json', 'comparator-scheme-miller-phase.json', 'comparator-scheme-alpha-character.json', 'comparator-relative-alpha.json', 'comparator-tate-alpha.json', 'comparator-phase-free-multiplier.json', 'comparator-multiplier-fourth.json', 'comparator-phase-free-alpha-descent.json', 'comparator-phase-free-key.json', 'comparator-even-point-evaluation.json', 'comparator-key-tate.json', 'comparator-arbitrary-rigidification.json', 'comparator-component-cusp.json', 'comparator-unary-geometric.json', 'comparator-component-hodge-degree.json', 'comparator-split-cusp.json', 'comparator-compact-alpha.json', 'comparator-isogeny-alpha-cusps.json', 'comparator-compact-alpha-half-line.json', 'comparator-isogeny-half-line.json', 'comparator-component-discriminant.json', 'comparator-discriminant-twist-root.json', 'comparator-common-half-hodge.json', 'comparator-compact-unary.json', 'comparator-split-discriminant.json', 'comparator-split-square-degree.json', 'comparator-field-unary.json', 'comparator.json', 'comparator-early.json', 'comparator-main-and-components.json', 'comparator-formal-cover.json', 'comparator-main-complete.json', 'comparator-sharp-adaptive-image.json', 'comparator-sharp-and-roots.json', 'comparator-sharp-and-coordinates.json', 'comparator-full-scheme-discriminant.json', 'comparator-scheme-kato.json'):
                  raise SystemExit('Unsupported comparator configuration')
              options = {
                  'comparator_config_path': config,
                  'authorization_relationship': 'I am a responsible author or maintainer',
              }
              metadata_paths = {'comparator-field-unary.json': 'submissions/field-unary/formalization.yaml', 'comparator-split-square-degree.json': 'submissions/split-square-degree/formalization.yaml', 'comparator-split-discriminant.json': 'submissions/split-discriminant/formalization.yaml', 'comparator-compact-unary.json': 'submissions/compact-unary/formalization.yaml', 'comparator-common-half-hodge.json': 'submissions/common-half-hodge/formalization.yaml', 'comparator-discriminant-twist-root.json': 'submissions/discriminant-twist-root/formalization.yaml', 'comparator-component-discriminant.json': 'submissions/component-discriminant/formalization.yaml', 'comparator-isogeny-half-line.json': 'submissions/isogeny-half-line/formalization.yaml', 'comparator-compact-alpha-half-line.json': 'submissions/compact-alpha-half-line/formalization.yaml', 'comparator-isogeny-alpha-cusps.json': 'submissions/isogeny-alpha-cusps/formalization.yaml', 'comparator-compact-alpha.json': 'submissions/compact-alpha/formalization.yaml', 'comparator-split-cusp.json': 'submissions/split-cusp/formalization.yaml', 'comparator-component-hodge-degree.json': 'submissions/component-hodge-degree/formalization.yaml', 'comparator-unary-geometric.json': 'submissions/unary-geometric/formalization.yaml', 'comparator-component-cusp.json': 'submissions/component-cusp/formalization.yaml', 'comparator-arbitrary-rigidification.json': 'submissions/arbitrary-rigidification/formalization.yaml', 'comparator-key-tate.json': 'submissions/key-tate/formalization.yaml', 'comparator-even-point-evaluation.json': 'submissions/even-point-evaluation/formalization.yaml', 'comparator-phase-free-key.json': 'submissions/phase-free-key/formalization.yaml', 'comparator-phase-free-alpha-descent.json': 'submissions/phase-free-alpha-descent/formalization.yaml', 'comparator-multiplier-fourth.json': 'submissions/multiplier-fourth/formalization.yaml', 'comparator-phase-free-multiplier.json': 'submissions/phase-free-multiplier/formalization.yaml', 'comparator-tate-alpha.json': 'submissions/tate-alpha/formalization.yaml', 'comparator-relative-alpha.json': 'submissions/relative-alpha/formalization.yaml', 'comparator-scheme-alpha-character.json': 'submissions/scheme-alpha-character/formalization.yaml', 'comparator-scheme-miller-phase.json': 'submissions/scheme-miller-phase/formalization.yaml', 'comparator-scheme-tate-unit.json': 'submissions/scheme-tate-unit/formalization.yaml', 'comparator-scheme-initial.json': 'submissions/scheme-initial/formalization.yaml', 'comparator-period-one.json': 'submissions/period-one/formalization.yaml', 'comparator-main-and-components.json': 'submissions/main-and-components/formalization.yaml', 'comparator-formal-cover.json': 'submissions/formal-cover/formalization.yaml', 'comparator-main-complete.json': 'submissions/main-complete/formalization.yaml', 'comparator-sharp-adaptive-image.json': 'submissions/sharp-adaptive-image/formalization.yaml', 'comparator-sharp-and-roots.json': 'submissions/sharp-and-roots/formalization.yaml', 'comparator-sharp-and-coordinates.json': 'submissions/sharp-and-coordinates/formalization.yaml', 'comparator-full-scheme-discriminant.json': 'submissions/full-scheme-discriminant/formalization.yaml', 'comparator-scheme-kato.json': 'submissions/scheme-kato/formalization.yaml'}
              if config in metadata_paths:
                  options['formalization_metadata_path'] = metadata_paths[config]
              print('options=' + json.dumps(options), file=output)
          PY
  palomar-preflight:
    needs: request
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.request.outputs.id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ needs.request.outputs.options }}
